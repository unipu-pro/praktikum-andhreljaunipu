name: ci

on:
  pull_request:
    types:
      - opened                           # the PR is created
      - synchronize                      # a new commit is pushed to the PR branch

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -v --junitxml=pytest-report.xml

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: pytest-report.xml

  docker:
    needs: test
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: Smoke test the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker image ls ghcr.io/${{ github.repository }}
          docker run --rm ghcr.io/${{ github.repository }}:${{ github.event.pull_request.head.sha }} --version
          test "$(docker run --rm ghcr.io/${{ github.repository }}:${{ github.event.pull_request.head.sha }} --version)" = "llm $VERSION"