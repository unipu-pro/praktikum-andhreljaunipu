name: release

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, e.g. v1.3.0"
        type: string
        required: true

permissions:
  contents: read
  packages: write                 # GITHUB_TOKEN may push to and read from ghcr.io

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Name and tag the image
        id: image
        env:
          TAG: ${{ inputs.tag }}                       # tag_name from release-please, e.g. v1.3.0
        run: |
          if [ "$TAG" != "v$(cat version.txt)" ]; then
            echo "::error::Tag $TAG does not match version.txt ($(cat version.txt))"
            exit 1
          fi
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/praktikum-llm-${GITHUB_ACTOR,,}"
          {
            echo "name=$name"
            echo "tag=$TAG"
            echo "tags<<EOF"                      # multi-line output: one image tag per line
            echo "$name:$TAG"
            echo "$name:latest"
            echo "$name:$GITHUB_SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}           # one tag per line

      - name: Job summary
        env:
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          {
            echo "### Released"
            for ref in $TAGS; do
              echo "- $ref"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  call-deploy:
    needs: build-image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      image-tag: ${{ needs.build-image.outputs.tag }}